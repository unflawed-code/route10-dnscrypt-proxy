name: Trivy Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Repository and upstream binary scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download configured upstream binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .trivy-input/dnscrypt .trivy-input/upx
          mapfile -t urls < <(python3 - <<'PY'
          import pathlib
          import tomllib

          config = tomllib.loads(pathlib.Path("conf/setup.toml").read_text(encoding="utf-8"))
          print(config["dnscrypt"]["download_url"])
          print(config["upx"]["download_url"])
          PY
          )

          curl -fsSL "${urls[0]}" -o .trivy-input/dnscrypt.tar.gz
          tar -xzf .trivy-input/dnscrypt.tar.gz -C .trivy-input/dnscrypt

          curl -fsSL "${urls[1]}" -o .trivy-input/upx.tar.xz
          tar -xJf .trivy-input/upx.tar.xz -C .trivy-input/upx

          find .trivy-input -maxdepth 4 -type f -print

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true

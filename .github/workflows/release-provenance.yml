name: SLSA Provenance

on:
  release:
    types:
      - published
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and checksum release artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(git ls-files '*.sh')
          for file in "${shell_files[@]}"; do
            echo "bash -n $file"
            bash -n "$file"
          done

      - name: Verify vendored signature verifier digest
        shell: bash
        run: |
          set -euo pipefail
          cd lib/vendor
          sha256sum -c route10-signature.sh.sha256

      - name: Run hermetic tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_dnsmasq_cutover.sh
          sh tests/test_toml_merge.sh
          sh tests/test_signature_verify.sh

      - name: Build release archive
        id: build
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="manual-${GITHUB_SHA::12}"
          fi
          name="${GITHUB_REPOSITORY##*/}-${version}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="${name}/" -o "dist/${name}.tar.gz" "${GITHUB_SHA}"
          (
            cd dist
            sha256sum "${name}.tar.gz" > SHA256SUMS
          )
          echo "archive_name=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          sha256sum dist/*

      - name: Generate SLSA subject
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.build.outputs.archive_name }}"
          hashes="$(cd dist && sha256sum "$archive" | base64 -w0)"
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 5

  provenance:
    name: Generate SLSA provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}

  release:
    name: Publish release artifacts
    needs: [build, provenance]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist

      - name: Publish GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi

          # The SLSA generator uploads its attestation first and creates the
          # release with an empty body, so notes can be missing even here.
          # A body that is only GitHub's generated changelog footer is treated
          # as missing: it tells nobody what changed.
          min_notes_chars=40
          notes_chars() {
            local body text
            body="$(gh release view "${GITHUB_REF_NAME}" --json body -q '.body // ""')"
            text="$(printf '%s\n' "${body}" | grep -v '^\*\*Full Changelog\*\*:' || true)"
            printf '%s' "${text}" | tr -d '[:space:]' | wc -c | tr -d ' '
          }

          chars="$(notes_chars)"
          if [ "${chars}" -lt "${min_notes_chars}" ]; then
            echo "Release ${GITHUB_REF_NAME} has no notes beyond the changelog link; generating them."
            generated="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${GITHUB_REF_NAME}" --jq .body)"
            if [ -n "$(printf '%s' "${generated}" | tr -d '[:space:]')" ]; then
              gh release edit "${GITHUB_REF_NAME}" --notes "${generated}"
            fi
            chars="$(notes_chars)"
          fi
          if [ "${chars}" -lt "${min_notes_chars}" ]; then
            echo "::error::Release ${GITHUB_REF_NAME} has no substantive release notes (${chars} chars after removing the changelog link); refusing to publish its assets."
            exit 1
          fi

          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

      - name: Verify provenance with slsa-verifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          archive="$(ls dist/*.tar.gz)"
          gh release download "${tag}" --pattern '*.intoto.jsonl' --dir provenance --clobber
          provenance="$(ls provenance/*.intoto.jsonl)"
          curl -fsSL -o "${RUNNER_TEMP}/slsa-verifier" \
            https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.1/slsa-verifier-linux-amd64
          chmod +x "${RUNNER_TEMP}/slsa-verifier"
          "${RUNNER_TEMP}/slsa-verifier" verify-artifact "${archive}" \
            --provenance-path "${provenance}" \
            --source-uri "github.com/${GITHUB_REPOSITORY}" \
            --source-tag "${tag}"
